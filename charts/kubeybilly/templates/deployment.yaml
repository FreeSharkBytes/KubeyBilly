apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubeybilly.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeybilly.labels" . | nindent 4 }}
spec:
  # Exactly one replica: incident state machines live in one BEAM node and
  # disk is the source of truth. Two responders improvising on the same
  # cluster is the failure mode, not the redundancy.
  replicas: 1
  selector:
    matchLabels:
      {{- include "kubeybilly.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubeybilly.selectorLabels" . | nindent 8 }}
      annotations:
        # Restart the pod when either ConfigMap changes so mounted files and
        # the app's view of policy never drift apart between watches.
        checksum/standing-orders: {{ include (print $.Template.BasePath "/configmap-standing-orders.yaml") . | sha256sum }}
        checksum/killswitch: {{ include (print $.Template.BasePath "/configmap-killswitch.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "kubeybilly.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubeybilly
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          env:
            - name: PHX_SERVER
              value: "true"
            - name: PORT
              value: "4000"
            # Evidence bundles land on the only writable mount besides /tmp.
            - name: INCIDENTS_DIR
              value: /app/incidents
            # Policy and kill switch paths, matching the ConfigMap mounts
            # below; config/runtime.exs turns these into app config.
            - name: STANDING_ORDERS_PATH
              value: /etc/kubeybilly/standing-orders/standing-orders.yaml
            - name: KILLSWITCH_PATH
              value: /etc/kubeybilly/killswitch/engaged
            # The release writes its boot-time runtime config under
            # RELEASE_TMP; point it at the /tmp emptyDir because the root
            # filesystem is read-only.
            - name: RELEASE_TMP
              value: /tmp
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubeybilly.fullname" . }}
                  key: SECRET_KEY_BASE
            # The webhook and manual trigger bearer token; required by
            # config/runtime.exs in prod, managed in the chart Secret.
            - name: WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubeybilly.fullname" . }}
                  key: WEBHOOK_TOKEN
            # Dashboard basic auth; the approve button must not be
            # anonymous (plan/13).
            - name: DASHBOARD_USER
              value: {{ .Values.dashboard.user | quote }}
            - name: DASHBOARD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubeybilly.fullname" . }}
                  key: DASHBOARD_PASSWORD
            {{- if .Values.advisor.enabled }}
            # The LLM advisor (plan/14), rendered only when it is switched on
            # so a default install keeps the app's compile-time stub instead
            # of inheriting chart opinions it never asked for. ADVISOR_ENABLED
            # opens the unmatched-signature path; the other three retarget the
            # provider without a rebuild.
            - name: ADVISOR_ENABLED
              value: "true"
            - name: ADVISOR_ADAPTER
              value: {{ .Values.advisor.adapter | quote }}
            - name: ADVISOR_BASE_URL
              value: {{ .Values.advisor.baseUrl | quote }}
            - name: ADVISOR_MODEL
              value: {{ .Values.advisor.model | quote }}
            {{- if .Values.advisor.existingSecret }}
            # The adapter reads ADVISOR_API_KEY from the environment at call
            # time, so the variable only has to exist in the container. It is
            # sourced from a Secret the operator owns: the key never appears
            # in values.yaml or in this manifest, which is the difference
            # between a rotatable credential and one baked into release state.
            - name: ADVISOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.advisor.existingSecret | quote }}
                  key: {{ required "advisor.secretKey is required when advisor.existingSecret is set" .Values.advisor.secretKey | quote }}
            {{- else if eq .Values.advisor.adapter "openai_compat" }}
            {{- fail "advisor.existingSecret must name a Secret holding the provider API key when advisor.adapter is openai_compat" }}
            {{- end }}
            {{- end }}
          volumeMounts:
            # The evidence volume: the one writable mount that matters.
            - name: incidents
              mountPath: /app/incidents
            - name: tmp
              mountPath: /tmp
            # Policy and kill switch, mounted read-only; the env vars above
            # point the app at these files.
            - name: standing-orders
              mountPath: /etc/kubeybilly/standing-orders
              readOnly: true
            - name: killswitch
              mountPath: /etc/kubeybilly/killswitch
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: incidents
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: standing-orders
          configMap:
            name: {{ include "kubeybilly.fullname" . }}-standing-orders
        - name: killswitch
          configMap:
            name: {{ include "kubeybilly.fullname" . }}-killswitch
