# SECRET_KEY_BASE for Phoenix session/cookie signing. When no value is set,
# one is generated at first install and preserved across upgrades by looking
# up the existing Secret, so a `helm upgrade` never silently rotates it.
{{- $name := include "kubeybilly.fullname" . }}
{{- $secretKeyBase := .Values.secretKeyBase }}
{{- if not $secretKeyBase }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing (hasKey $existing.data "SECRET_KEY_BASE") }}
{{- $secretKeyBase = index $existing.data "SECRET_KEY_BASE" | b64dec }}
{{- else }}
{{- $secretKeyBase = randAlphaNum 64 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeybilly.labels" . | nindent 4 }}
type: Opaque
data:
  SECRET_KEY_BASE: {{ $secretKeyBase | b64enc | quote }}
