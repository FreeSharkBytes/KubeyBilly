# Secrets the app boots with. When a value is not set explicitly, one is
# generated at first install and preserved across upgrades by looking up
# the existing Secret, so a `helm upgrade` never silently rotates it:
# - SECRET_KEY_BASE: Phoenix session/cookie signing.
# - WEBHOOK_TOKEN: shared bearer token for the alert webhook and the
#   manual trigger; the Alertmanager receiver presents it via
#   http_config.authorization (plan/13).
# - DASHBOARD_PASSWORD: basic auth for the dashboard and its approve
#   button. The username is plain configuration in values.yaml.
{{- $name := include "kubeybilly.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $secretKeyBase := .Values.secretKeyBase }}
{{- if not $secretKeyBase }}
{{- if and $existing (hasKey $existing.data "SECRET_KEY_BASE") }}
{{- $secretKeyBase = index $existing.data "SECRET_KEY_BASE" | b64dec }}
{{- else }}
{{- $secretKeyBase = randAlphaNum 64 }}
{{- end }}
{{- end }}
{{- $webhookToken := .Values.webhookToken }}
{{- if not $webhookToken }}
{{- if and $existing (hasKey $existing.data "WEBHOOK_TOKEN") }}
{{- $webhookToken = index $existing.data "WEBHOOK_TOKEN" | b64dec }}
{{- else }}
{{- $webhookToken = randAlphaNum 48 }}
{{- end }}
{{- end }}
{{- $dashboardPassword := .Values.dashboard.password }}
{{- if not $dashboardPassword }}
{{- if and $existing (hasKey $existing.data "DASHBOARD_PASSWORD") }}
{{- $dashboardPassword = index $existing.data "DASHBOARD_PASSWORD" | b64dec }}
{{- else }}
{{- $dashboardPassword = randAlphaNum 24 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeybilly.labels" . | nindent 4 }}
type: Opaque
data:
  SECRET_KEY_BASE: {{ $secretKeyBase | b64enc | quote }}
  WEBHOOK_TOKEN: {{ $webhookToken | b64enc | quote }}
  DASHBOARD_PASSWORD: {{ $dashboardPassword | b64enc | quote }}
