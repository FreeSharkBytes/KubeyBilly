image:
  repository: localhost/kubeybilly
  tag: dev
  # Images are side-loaded into kind for local work; IfNotPresent also suits
  # a real registry once one exists.
  pullPolicy: IfNotPresent

# Phoenix cookie/session signing secret. Leave empty to let the chart manage
# one: a random value is generated on first install and preserved across
# upgrades (helm lookup). Set explicitly to rotate or pin it.
secretKeyBase: ""

# Shared bearer token for the alert webhook and manual trigger (plan/13).
# Managed like secretKeyBase: leave empty to generate on first install and
# preserve across upgrades; set explicitly to rotate or pin. Configure the
# same value on the Alertmanager receiver via http_config.authorization.
webhookToken: ""

# HTTP basic auth for the dashboard and its approve button (plan/13,
# demo-grade on purpose; put your SSO proxy in front for real use). The
# password is managed like secretKeyBase when left empty.
dashboard:
  user: billy
  password: ""

service:
  type: ClusterIP
  port: 4000

# A first responder that OOMKills itself is a bad look: the limit is double
# the request so evidence capture bursts (log fetches, bundle writes) have
# headroom without letting the BEAM grow unbounded.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# Kill switch, mirrored into the killswitch ConfigMap (key "engaged").
# Flip to "true" to stop every write path before it mutates.
killswitch:
  engaged: "false"

# Standing orders: the policy file (plan/04). Rendered verbatim as YAML into
# the standing-orders ConfigMap. Defaults mirror the documented schema with
# mode dry_run: everything runs, nothing mutates, which is the honest answer
# to "is it safe to install."
standingOrders:
  scope:
    namespaces_include: ["demo"]
    namespaces_exclude: ["kube-system", "kubeybilly"]
  tiers:
    read: { actions: [no_action], auto: true }
    restart: { actions: [restart_pod, restart_workload], auto: true, min_confidence: 0.8 }
    rollback: { actions: [rollback_deployment], auto: false, min_confidence: 0.9 }
    scale: { actions: [scale], auto: false, max_delta: 2 }
    node: { actions: [cordon_node], auto: false }
  budgets:
    actions_per_incident: 2
    actions_per_hour: 10
    max_pods_touched: 20
  deny_kinds:
    - PersistentVolumeClaim
    - PersistentVolume
    - StatefulSet
    - Namespace
    - CustomResourceDefinition
  freeze_when:
    rollout_in_progress: true
    maintenance_window: false
  verification:
    window_seconds: 90
  approval:
    timeout_seconds: 300
  mode: dry_run
